<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoGames – Queens, Tango, Zip, Mini Sudoku, Patches</title>
<style>
:root{
  --bg:#0E1013;
  --bg-dot: rgba(255,255,255,.045);
  --card:#181B21;
  --card2:#20242C;
  --ink:#F1F2F5;
  --muted:#8A90A0;
  --line: rgba(255,255,255,.09);
  --line2: rgba(255,255,255,.16);
  --error:#FF5C6C;
  --queens:#9C7CFF;
  --tango:#2FD3B8;
  --zip:#FFA858;
  --sudoku:#6E93FF;
  --patches:#FF6E7F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg);
  background-image: radial-gradient(circle, var(--bg-dot) 1px, transparent 1px);
  background-size: 22px 22px;
  color:var(--ink);
  font-family: -apple-system, "Segoe UI", "Century Gothic", Avenir, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#app{ min-height:100vh; }
button{ font-family:inherit; cursor:pointer; }
.mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* ===== MENU ===== */
.menu-wrap{ max-width:920px; margin:0 auto; padding:48px 24px 64px; }
.hero{ text-align:center; margin-bottom:40px; }
.eyebrow{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:12.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:0 0 12px;
}
.hero h1{
  font-size:clamp(2.4rem,6vw,3.6rem); margin:0 0 14px; font-weight:800;
  letter-spacing:-.02em;
  background: linear-gradient(100deg, var(--queens), var(--sudoku) 45%, var(--tango) 85%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-sub{ color:var(--muted); font-size:1.05rem; max-width:480px; margin:0 auto; line-height:1.55; }

.hero-photo{
  width:96px; height:96px; border-radius:50%; object-fit:cover;
  border:2px solid var(--line2); box-shadow:var(--shadow); margin-bottom:14px;
}
.hero-actions{ margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.btn-icon-menu{
  width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line2);
  color:var(--muted); font-size:1.05rem; font-weight:800; display:flex; align-items:center; justify-content:center;
  padding:0;
}
.btn-icon-menu:hover{ color:var(--ink); border-color:var(--line2); }
.btn-icon-menu:disabled{ opacity:.6; cursor:default; }

.btn-help-game{
  width:24px; height:24px; border-radius:50%; background:var(--card2); border:1px solid var(--line2);
  color:var(--muted); font-weight:800; font-size:.8rem; display:flex; align-items:center; justify-content:center;
  padding:0; line-height:1;
}
.btn-help-game:hover{ color:var(--accent); border-color:var(--accent); }

.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.modal-box{
  background:var(--card); border:1px solid var(--line2); border-radius:16px;
  max-width:480px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow);
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:18px 20px 8px; position:sticky; top:0; background:var(--card);
}
.modal-head h3{ margin:0; font-size:1.15rem; font-weight:800; }
.modal-close{
  width:28px; height:28px; border-radius:50%; background:var(--card2); border:1px solid var(--line2);
  color:var(--ink); font-size:1.1rem; display:flex; align-items:center; justify-content:center; padding:0;
}
.modal-close:hover{ border-color:var(--error); color:var(--error); }
.modal-body{ padding:8px 20px 20px; }
.help-entry{ padding:10px 0; border-bottom:1px solid var(--line); }
.help-entry:last-child{ border-bottom:none; }
.help-entry h4{ margin:0 0 5px; font-size:1rem; font-weight:700; color:var(--ink); }
.help-entry p{ margin:0; color:var(--muted); font-size:.9rem; line-height:1.5; }

.card-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; }
.game-card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:22px 20px 20px; text-align:left; display:flex; flex-direction:column; gap:10px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.game-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:var(--accent);
}
.game-card:hover{ transform:translateY(-3px); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow:0 4px 10px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.4); }
.game-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.card-icon{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background: color-mix(in srgb, var(--accent) 20%, black); color:var(--accent);
}
.card-icon svg{ width:26px; height:26px; }
.card-name{ font-weight:700; font-size:1.15rem; color:var(--ink); }
.card-tagline{ color:var(--muted); font-size:.88rem; line-height:1.4; }

.accent-queens{ --accent:var(--queens); }
.accent-tango{ --accent:var(--tango); }
.accent-zip{ --accent:var(--zip); }
.accent-sudoku{ --accent:var(--sudoku); }
.accent-patches{ --accent:var(--patches); }

/* ===== GAME SHELL ===== */
.game-shell{ max-width:720px; margin:0 auto; padding:20px 20px 48px; }
.game-topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
.btn-back{
  background:var(--card); border:1px solid var(--line2); border-radius:10px; padding:8px 14px;
  color:var(--ink); font-size:.9rem; font-weight:600;
}
.btn-back:hover{ border-color:var(--accent); color:var(--accent); }
.game-title{ display:flex; align-items:center; gap:10px; }
.game-title h2{ margin:0; font-size:1.35rem; font-weight:800; }
.title-icon{ width:30px; height:30px; color:var(--accent); }
.title-icon svg{ width:100%; height:100%; }
.timer{
  font-size:1rem; font-weight:700; color:var(--ink); background:var(--card2);
  border:1px solid var(--line2); border-radius:10px; padding:7px 14px; letter-spacing:.02em;
}
.game-rule{ color:var(--muted); font-size:.9rem; line-height:1.5; margin:14px 0 20px; text-align:center; }
.game-stage{ display:flex; flex-direction:column; align-items:center; gap:14px; }

.game-actions-row{ display:flex; justify-content:center; gap:10px; margin-top:20px; }
.btn-ghost, .btn-solid{
  border-radius:10px; padding:10px 18px; font-weight:700; font-size:.9rem; border:1px solid transparent;
  touch-action:manipulation;
}
.btn-ghost{ background:var(--card); border-color:var(--line2); color:var(--ink); }
.btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
.btn-solid{ background:var(--accent); color:#0E1013; }
.btn-solid:hover{ filter:brightness(1.1); }

.stage-wrap{ position:relative; }
.win-banner{
  position:absolute; inset:0; z-index:60;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:rgba(14,16,19,.66); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  border-radius:18px; text-align:center; padding:20px;
}
.win-banner span{ background:var(--accent); color:#0E1013; border-radius:14px; padding:12px 20px; font-weight:700; box-shadow:var(--shadow); }
.win-banner .btn-solid{ background:var(--accent); color:#0E1013; }
.win-banner[hidden]{ display:none; }

.game-stage{ position:relative; }
.win-shimmer{
  position:absolute; inset:-10px; pointer-events:none; z-index:50;
  border-radius:18px; overflow:hidden;
}
.win-shimmer::before{
  content:''; position:absolute; top:0; left:-160%; width:140%; height:100%;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.65) 50%, transparent 70%);
  animation: winSweep .9s ease-out forwards;
  mix-blend-mode: overlay;
}
.win-shimmer::after{
  content:''; position:absolute; inset:0; border-radius:18px;
  box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
  animation: winGlow .9s ease-out forwards;
}
@keyframes winSweep{
  0%{ left:-160%; }
  100%{ left:160%; }
}
@keyframes winGlow{
  0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  60%{ box-shadow:0 0 36px 10px color-mix(in srgb, var(--accent) 45%, transparent); }
  100%{ box-shadow:0 0 36px 10px transparent; }
}
@media (prefers-reduced-motion: reduce){
  .win-shimmer::before{ display:none; }
  .win-shimmer::after{
    animation: winGlowStatic .9s ease-out forwards;
  }
}
@keyframes winGlowStatic{
  0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  100%{ box-shadow:0 0 0 0 transparent; }
}

/* live error state shared by all games */
.cell-error{ box-shadow: inset 0 0 0 2px var(--error) !important; }

/* ===== QUEENS ===== */
.queens-board{
  display:grid; grid-template-columns:repeat(var(--n), 1fr); grid-template-rows:repeat(var(--n), 1fr);
  width:min(92vw,440px); aspect-ratio:1; border-radius:10px; overflow:hidden;
  box-shadow:var(--shadow); border:2px solid var(--line2);
}
.q-cell{
  display:flex; align-items:center; justify-content:center; position:relative;
  border:1px solid rgba(0,0,0,.18); font-size:clamp(16px,4vw,26px); user-select:none; touch-action:manipulation;
}
.mark-x{ color:rgba(14,16,19,.55); font-weight:700; }
.mark-q{ color:#0E1013; filter:drop-shadow(0 1px 1px rgba(255,255,255,.25)); font-size:1.5em; line-height:1; }
.mark-q-photo{
  width:72%; height:72%; border-radius:50%; object-fit:cover;
  box-shadow:0 0 0 2px rgba(14,16,19,.35), 0 2px 4px rgba(0,0,0,.35);
}

/* ===== TANGO ===== */
.tango-board{
  position:relative; display:grid; grid-template-columns:repeat(var(--n),1fr); grid-template-rows:repeat(var(--n),1fr);
  width:min(92vw,420px); aspect-ratio:1; background:var(--card2);
  border-radius:10px; overflow:visible; box-shadow:var(--shadow); border:2px solid var(--line2);
}
.tg-cell{
  display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
  font-size:clamp(18px,5vw,28px); user-select:none; touch-action:manipulation;
}
.tg-cell.fixed{ background:rgba(255,255,255,.045); }
.mark-sun{ color:var(--zip); }
.mark-moon{ color:var(--sudoku); }
.tg-edge{
  position:absolute; transform:translate(-50%,-50%); width:19px; height:19px; border-radius:50%;
  background:var(--card); border:1.5px solid var(--line2); display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; z-index:2; pointer-events:none; color:var(--ink);
}
.tg-edge.edge-error{ border-color:var(--error); color:var(--error); }

/* ===== SUDOKU ===== */
.sudoku-board{
  display:grid; grid-template-columns:repeat(var(--n),1fr); grid-template-rows:repeat(var(--n),1fr);
  width:min(92vw,420px); aspect-ratio:1; box-shadow:var(--shadow); border-radius:10px; overflow:hidden;
  border:2px solid var(--line2);
}
.su-cell{
  display:flex; align-items:center; justify-content:center; font-size:clamp(16px,4.5vw,24px);
  border-right:1px solid var(--line); border-bottom:1px solid var(--line); user-select:none; font-weight:600;
  color:var(--sudoku); touch-action:manipulation;
}
.su-cell.fixed{ color:var(--ink); font-weight:800; }
.su-cell.shade{ background:rgba(255,255,255,.035); }
.su-cell.box-left{ border-left:2px solid var(--line2); }
.su-cell.box-top{ border-top:2px solid var(--line2); }
.su-cell:not(.fixed){ cursor:pointer; }
.su-cell.selected{ background:color-mix(in srgb, var(--sudoku) 24%, var(--card)); }
.num-pad{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:420px; }
.num-btn{
  min-width:44px; padding:11px 15px; border-radius:10px; border:1px solid var(--line2);
  background:var(--card2); color:var(--ink); font-weight:700; font-size:1rem; touch-action:manipulation;
}
.num-btn:hover{ border-color:var(--sudoku); color:var(--sudoku); }
.num-clear{ font-size:.82rem; }

/* ===== ZIP ===== */
.zip-wrap{ touch-action:none; display:flex; flex-direction:column; align-items:center; gap:10px; }
.zip-board{
  position:relative; display:grid; grid-template-columns:repeat(var(--cols),1fr); grid-template-rows:repeat(var(--rows),1fr);
  width:min(92vw,440px); aspect-ratio: var(--cols) / var(--rows);
  box-shadow:var(--shadow); border-radius:10px; overflow:hidden; border:2px solid var(--line2); background:var(--card2);
}
.zip-cell{
  position:relative; display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
  touch-action:none; user-select:none;
}
.zip-cell.in-path{ background: color-mix(in srgb, var(--zip) 25%, var(--card2)); }
.zip-cell.path-end{ background: color-mix(in srgb, var(--zip) 55%, var(--card2)); }
.zip-num{
  width:62%; height:62%; border-radius:50%; background:var(--card); border:2px solid var(--line2);
  display:flex; align-items:center; justify-content:center; font-weight:800; z-index:2; color:var(--ink);
  font-size:clamp(12px,3.4vw,18px);
}
.zip-line-overlay{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
.zip-poly{ fill:none; stroke:var(--zip); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.zip-wall{ position:absolute; background:var(--ink); z-index:3; border-radius:2px; }
.zip-wall-v{ width:4px; transform:translateX(-50%); }
.zip-wall-h{ height:4px; transform:translateY(-50%); }
.zip-progress{ color:var(--muted); font-size:.85rem; margin:0; }

/* ===== PATCHES ===== */
.patches-board{
  display:grid; grid-template-columns:repeat(var(--cols),1fr); grid-template-rows:repeat(var(--rows),1fr);
  width:min(92vw,460px); aspect-ratio: var(--cols) / var(--rows);
  box-shadow:var(--shadow); border-radius:10px; overflow:hidden; border:2px solid var(--line2);
  touch-action:none; background:var(--card2);
}
.patch-cell{
  position:relative; display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.08); touch-action:none; user-select:none;
}
.patch-cell.preview{ outline:2px dashed var(--patches); outline-offset:-2px; z-index:3; }
.patch-cell.edge-t{ border-top:2px solid var(--line2); }
.patch-cell.edge-b{ border-bottom:2px solid var(--line2); }
.patch-cell.edge-l{ border-left:2px solid var(--line2); }
.patch-cell.edge-r{ border-right:2px solid var(--line2); }
.patch-preview{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  border-radius:2px; opacity:.4; z-index:0;
}
.patch-cell.has-patch .patch-preview{ opacity:0; }
.patch-clue{
  position:relative; z-index:1; font-weight:800; font-size:clamp(13px,3.4vw,18px);
  color:var(--ink); mix-blend-mode: normal;
}

/* ===== RESPONSIVE ===== */
@media (max-width:520px){
  .game-topbar{ flex-direction:column; align-items:stretch; }
  .game-title{ justify-content:center; }
  .timer{ align-self:center; }
  .game-actions-row button{ flex:1; }
}

@media (prefers-reduced-motion: reduce){
  .game-card{ transition:none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ SOUND (tiny synthesized effects, no audio files needed) ============ */
const Sound = (function(){
  let ctx = null, unlocked = false;
  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, peak, delay){
    try{
      const c = ensureCtx();
      if(!c) return;
      const t0 = c.currentTime + (delay||0);
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(peak!=null?peak:0.16, t0+0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.08));
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t0); osc.stop(t0+(dur||0.08)+0.03);
      unlocked = true;
    }catch(err){ /* ignore: audio isn't essential to gameplay */ }
  }
  return {
    mark(){ tone(340, 0.07, 'triangle', 0.14); },        // Queens: X set
    queen(){ tone(680, 0.10, 'sine', 0.17); },           // Queens: queen set
    sun(){ tone(720, 0.08, 'sine', 0.15); },             // Tango: sun set
    moon(){ tone(420, 0.09, 'sine', 0.15); },            // Tango: moon set
    number(){ tone(520, 0.07, 'triangle', 0.14); },      // Sudoku: number set
    checkpoint(){ tone(780, 0.09, 'sine', 0.17); },      // Zip: checkpoint reached
    snap(){ tone(320, 0.05, 'square', 0.10); tone(640, 0.08, 'sine', 0.15, 0.04); }, // Patches: snap in
    win(){                                                // shared: level solved
      [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tone(f, 0.17, 'sine', 0.18, i*0.09));
    },
    unlock(){
      // Safari (especially iOS) only lets an AudioContext actually produce sound if
      // it's created/resumed directly inside a user gesture. This plays one short,
      // quiet confirmation tone right in that gesture to "prove" audio is working.
      const c = ensureCtx();
      if(!c) return false;
      tone(880, 0.07, 'sine', 0.13);
      return true;
    },
    isUnlocked(){ return unlocked; }
  };

/* ============ UTILITIES ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

const APP = document.getElementById('app');

const GAMES = [
  { id:'queens', name:'Queens', accent:'queens', icon: iconQueens },
  { id:'tango', name:'Tango', accent:'tango', icon: iconTango },
  { id:'zip', name:'Zip', accent:'zip', icon: iconZip },
  { id:'sudoku', name:'Mini Sudoku', accent:'sudoku', icon: iconSudoku },

];

function renderMenu(){
  stopTimer();
  APP.innerHTML = '';
  const wrap = el('div','menu-wrap');
  const hero = el('div','hero');
  hero.innerHTML = `
    <img class="hero-photo" src="${AVATAR_SRC}" alt="">
    <h1>LingoGames</h1>
    <div class="hero-actions">
      <button class="btn-icon-menu" id="btnSoundOn" aria-label="Enable sound" title="Enable sound">🔊</button>
      <button class="btn-icon-menu" id="btnHelpMenu" aria-label="How to play" title="How to play">?</button>
    </div>
  `;
  wrap.appendChild(hero);
  const grid = el('div','card-grid');
  GAMES.forEach(g=>{
    const card = el('button', `game-card accent-${g.accent}`);
    card.innerHTML = `
      <span class="card-icon">${g.icon()}</span>
      <span class="card-name">${g.name}</span>
    `;
    card.addEventListener('click', ()=> startGame(g.id));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  APP.appendChild(wrap);
  document.getElementById('btnSoundOn').addEventListener('click', ()=>{
    const ok = Sound.unlock();
    const btn = document.getElementById('btnSoundOn');
    if(ok){ btn.textContent = '🔊✓'; btn.disabled = true; btn.title = 'Sound enabled'; }
    else{ btn.textContent = '🔇'; btn.disabled = true; btn.title = 'Sound not available'; }
  });
  document.getElementById('btnHelpMenu').addEventListener('click', ()=>{
    const body = GAMES.map(g=>
      `<div class="help-entry"><h4>${g.name}</h4><p>${MODULES[g.id].RULE}</p></div>`
    ).join('');
    openModal('How to play', body);
  });
}

let currentModule = null;

function startGame(id){
  const meta = GAMES.find(g=>g.id===id);
  currentModule = MODULES[id];
  renderGameShell(meta);
  currentModule.newLevel();
}

function renderGameShell(meta){
  document.onpointermove = null;
  document.onpointerup = null;
  APP.innerHTML = '';
  const shell = el('div', `game-shell accent-${meta.accent}`);
  shell.innerHTML = `
    <div class="game-topbar">
      <button class="btn-back" id="btnBack" aria-label="Back to menu">&larr; Menu</button>

      <button class="btn-ghost" id="btnReset">Reset</button>
      <button class="btn-solid" id="btnNew">New level</button>
    </div>
  `;
  APP.appendChild(shell);

}

function openModal(titleText, bodyHtml){
  closeModal();
  const overlay = el('div','modal-overlay');
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3></h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  `;
  overlay.querySelector('.modal-head h3').textContent = titleText;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  overlay.querySelector('.modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', modalEscHandler);
  document.body.appendChild(overlay);
}
function closeModal(){
  const existing = document.querySelector('.modal-overlay');
  if(existing) existing.remove();
  document.removeEventListener('keydown', modalEscHandler);
}
function modalEscHandler(e){ if(e.key==='Escape') closeModal(); }

function setRule(text){
  const r = document.getElementById('gameRule');
  if(!r) return;
  r.textContent = text;
  r.style.display = text ? '' : 'none';
}
function getStage(){
  return document.getElementById('gameStage');
}

/* ---- win state + timer, shared across all modules ---- */
let timerInterval = null, timerStart = null;
function resetTimer(){
  clearInterval(timerInterval);
  timerStart = Date.now();
  updateTimerDisplay();
  timerInterval = setInterval(updateTimerDisplay, 500);
}
function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
}
function formatElapsed(){
  const secs = Math.max(0, Math.floor((Date.now()-timerStart)/1000));
  const m = String(Math.floor(secs/60)).padStart(2,'0');
  const s = String(secs%60).padStart(2,'0');
  return `${m}:${s}`;
}
function updateTimerDisplay(){
  const t = document.getElementById('gameTimer');
  if(!t){ stopTimer(); return; }
  t.textContent = formatElapsed();
}
function showWin(){
  const wb = document.getElementById('winBanner');
  if(!wb || !wb.hidden) return; // already shown, avoid re-trigger spam
  const wt = document.getElementById('winTime');
  if(wt) wt.textContent = formatElapsed();
  stopTimer();
  wb.hidden = false;
  Sound.win();
  triggerWinShimmer();
}
function triggerWinShimmer(){
  const stage = document.getElementById('gameStage');
  if(!stage) return;
  const shimmer = el('div','win-shimmer');
  stage.appendChild(shimmer);
  setTimeout(()=> shimmer.remove(), 1000);
}
function hideWin(){
  const wb = document.getElementById('winBanner');
  if(wb) wb.hidden = true;
}
function isWinShown(){
  const wb = document.getElementById('winBanner');
  return wb && !wb.hidden;
}

/* ============ QUEENS ============ */
const Queens = (function(){
  let n, regionOf, regionColors, cellState, cellEls; // cellState: 0 empty, 1 = X mark, 2 = queen

  function generateSolution(size){
    const cols = [];
    function backtrack(row){
      if(row===size) return true;
      const order = shuffle([...Array(size).keys()]);
      for(const c of order){
        if(cols.includes(c)) continue;
        if(row>0 && Math.abs(cols[row-1]-c)<=1) continue;
        cols[row]=c;
        if(backtrack(row+1)) return true;
        cols.pop();
      }
      return false;
    }
    backtrack(0);
    return cols.map((c,r)=>({r,c}));
  }

  function growRegions(size, queens){
    const rOf = Array.from({length:size},()=>Array(size).fill(-1));
    queens.forEach((q,i)=>rOf[q.r][q.c]=i);
    let remaining = size*size - size;
    let guard = 0;
    while(remaining>0 && guard<3000){
      guard++;
      const frontier = [];
      for(let r=0;r<size;r++) for(let c=0;c<size;c++){
        if(rOf[r][c]!==-1) continue;
        const regsAdj = new Set();
        for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nr=r+dr, nc=c+dc;
          if(nr>=0&&nr<size&&nc>=0&&nc<size&&rOf[nr][nc]!==-1) regsAdj.add(rOf[nr][nc]);
        }
        for(const ri of regsAdj) frontier.push({r,c,ri});
      }
      if(frontier.length===0) break;
      const sample = shuffle(frontier).slice(0, Math.min(frontier.length, 6));
      // Try a handful of random frontier options and keep whichever currently
      // leaves the fewest possible queen placements — this steers growth toward
      // a uniquely-solvable layout instead of a loosely-constrained random blob.
      let best=null, bestCount=Infinity;
      for(const cand of sample){
        rOf[cand.r][cand.c] = cand.ri;
        const cnt = countSolutions(size, rOf, 3);
        rOf[cand.r][cand.c] = -1;
        if(cnt < bestCount){ bestCount = cnt; best = cand; if(bestCount<=1) break; }
      }
      if(!best) best = sample[0];
      rOf[best.r][best.c] = best.ri;
      remaining--;
    }
    return {rOf, remaining};
  }

  function countSolutions(size, rOf, cap){
    const usedCols = new Array(size).fill(false);
    const usedRegions = new Array(size).fill(false);
    let count = 0;
    function bt(row, prevCol){
      if(count>=cap) return;
      if(row===size){ count++; return; }
      for(let c=0;c<size;c++){
        if(usedCols[c]) continue;
        const reg = rOf[row][c];
        if(reg===-1) continue; // unassigned cell (mid-growth): not usable yet
        if(prevCol!==-1 && Math.abs(prevCol-c)<=1) continue;
        if(usedRegions[reg]) continue;
        usedCols[c]=true; usedRegions[reg]=true;
        bt(row+1, c);
        usedCols[c]=false; usedRegions[reg]=false;
        if(count>=cap) return;
      }
    }
    bt(0,-1);
    return count;
  }

  const RULE = 'Exactly one queen per row, column, and color region. Queens can\'t touch diagonally. Tap: empty → X → queen.';

  function newLevel(){
    n = randInt(7,8);
    let result, tries=0, unique=false;
    do{
      tries++;
      const queens = generateSolution(n);
      result = growRegions(n, queens);
      unique = result.remaining===0 && countSolutions(n, result.rOf, 2)===1;
    } while(!unique && tries<15);
    regionOf = result.rOf;
    const palette = ['#6C5CE7','#00B8A9','#FF6B6B','#FFA94D','#4DABF7','#F783AC','#94D82D','#9775FA'];
    regionColors = Array.from({length:n},(_,i)=>palette[i%palette.length]);
    resetTimer();
    reset();
  }

  function reset(){
    cellState = Array.from({length:n},()=>Array(n).fill(0));
    setRule('');
    hideWin();
    render();
  }

  function render(){
    const stage = getStage();
    stage.innerHTML = '';
    const board = el('div','queens-board');
    board.style.setProperty('--n', n);
    cellEls = [];
    for(let r=0;r<n;r++){
      cellEls.push([]);
      for(let c=0;c<n;c++){
        const cell = el('div','q-cell');
        cell.style.background = regionColors[regionOf[r][c]];
        cell.dataset.r = r; cell.dataset.c = c;
        updateCellContent(cell, cellState[r][c]);
        cell.addEventListener('click', ()=>{
          if(isWinShown()) return;
          cellState[r][c] = (cellState[r][c]+1)%3;
          updateCellContent(cell, cellState[r][c]);
          if(cellState[r][c]===1) Sound.mark();
          else if(cellState[r][c]===2) Sound.queen();
          validate();
        });
        board.appendChild(cell);
        cellEls[r].push(cell);
      }
    }
    stage.appendChild(board);
    validate();
  }

  function updateCellContent(cell, state){
    cell.innerHTML = state===1 ? '<span class="mark-x">&times;</span>' : state===2 ? `<img class="mark-q-photo" src="${AVATAR_SRC}" alt="">` : '';
  }

  function validate(){
    const queens = [];
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      cellEls[r][c].classList.remove('cell-error');
      if(cellState[r][c]===2) queens.push({r,c});
    }
    const errorSet = new Set();
    for(let i=0;i<queens.length;i++){
      for(let j=i+1;j<queens.length;j++){
        const a=queens[i], b=queens[j];
        const conflict = a.r===b.r || a.c===b.c || regionOf[a.r][a.c]===regionOf[b.r][b.c] ||
          (Math.abs(a.r-b.r)<=1 && Math.abs(a.c-b.c)<=1);
        if(conflict){ errorSet.add(a.r+','+a.c); errorSet.add(b.r+','+b.c); }
      }
    }
    errorSet.forEach(key=>{
      const [r,c] = key.split(',').map(Number);
      cellEls[r][c].classList.add('cell-error');
    });
    if(queens.length===n && errorSet.size===0) showWin();
  }

  return { newLevel, reset, RULE };
})();

/* ============ TANGO ============ */
const Tango = (function(){
  const N = 6;
  let givens, edges, cellState, cellEls, edgeEls, errorTimeout=null;
  const RULE = 'Exactly 3× sun and 3× moon per row & column. Never three of the same in a row. = means same, × means different.';

  function generateSolution(){
    const grid = Array.from({length:N},()=>Array(N).fill(-1));
    function countRow(r,v,upto){ let c=0; for(let i=0;i<upto;i++) if(grid[r][i]===v) c++; return c; }
    function countCol(c,v,upto){ let cnt=0; for(let i=0;i<upto;i++) if(grid[i][c]===v) cnt++; return cnt; }
    function ok(r,c,v){
      if(c>=2 && grid[r][c-1]===v && grid[r][c-2]===v) return false;
      if(r>=2 && grid[r-1][c]===v && grid[r-2][c]===v) return false;
      if(countRow(r,v,c)>=3) return false;
      if(countCol(c,v,r)>=3) return false;
      return true;
    }
    function backtrack(idx){
      if(idx===N*N) return true;
      const r=Math.floor(idx/N), c=idx%N;
      for(const v of shuffle([0,1])){
        if(ok(r,c,v)){
          grid[r][c]=v;
          if(backtrack(idx+1)) return true;
          grid[r][c]=-1;
        }
      }
      return false;
    }
    backtrack(0);
    return grid;
  }

  function buildAllEdges(solution){
    const list = [];
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(c+1<N) list.push({r1:r,c1:c,r2:r,c2:c+1,type: solution[r][c]===solution[r][c+1]?'eq':'neq'});
      if(r+1<N) list.push({r1:r,c1:c,r2:r+1,c2:c,type: solution[r][c]===solution[r+1][c]?'eq':'neq'});
    }
    return list;
  }

  function countSolutions(gv, ed, cap){
    const grid = gv.map(row=>row.slice());
    let count=0;
    function countRow(r,v,upto){let c=0;for(let i=0;i<upto;i++) if(grid[r][i]===v)c++;return c;}
    function countCol(c,v,upto){let cnt=0;for(let i=0;i<upto;i++) if(grid[i][c]===v)cnt++;return cnt;}
    function edgeOk(r,c){
      for(const e of ed){
        let other=null;
        if(e.r1===r&&e.c1===c && grid[e.r2][e.c2]!==-1) other=grid[e.r2][e.c2];
        else if(e.r2===r&&e.c2===c && grid[e.r1][e.c1]!==-1) other=grid[e.r1][e.c1];
        if(other!==null){
          const v = grid[r][c];
          if(e.type==='eq' && v!==other) return false;
          if(e.type==='neq' && v===other) return false;
        }
      }
      return true;
    }
    function ok(r,c,v){
      grid[r][c]=v;
      let good=true;
      if(c>=2 && grid[r][c-1]===v && grid[r][c-2]===v) good=false;
      if(good && r>=2 && grid[r-1][c]===v && grid[r-2][c]===v) good=false;
      if(good && countRow(r,v,c+1)>3) good=false;
      if(good && countCol(c,v,r+1)>3) good=false;
      if(good && !edgeOk(r,c)) good=false;
      grid[r][c]=-1;
      return good;
    }
    function backtrack(idx){
      if(count>=cap) return;
      if(idx===N*N){
        for(let r=0;r<N;r++) if(countRow(r,0,N)!==3) return;
        for(let c=0;c<N;c++) if(countCol(c,0,N)!==3) return;
        count++;
        return;
      }
      const r=Math.floor(idx/N), c=idx%N;
      if(grid[r][c]!==-1){ backtrack(idx+1); return; }
      for(const v of [0,1]){
        if(ok(r,c,v)){
          grid[r][c]=v;
          backtrack(idx+1);
          grid[r][c]=-1;
        }
        if(count>=cap) return;
      }
    }
    backtrack(0);
    return count;
  }

  function generatePuzzle(){
    const solution = generateSolution();
    const allEdges = shuffle(buildAllEdges(solution));
    const gv = Array.from({length:N},()=>Array(N).fill(-1));
    const cellsOrder = shuffle([...Array(N*N).keys()]);
    const chosenEdges = [];
    let edgeIdx=0, cellIdx=0;
    for(let i=0;i<3 && edgeIdx<allEdges.length;i++) chosenEdges.push(allEdges[edgeIdx++]);
    for(let i=0;i<3 && cellIdx<cellsOrder.length;i++){
      const idx = cellsOrder[cellIdx++];
      const r=Math.floor(idx/N), c=idx%N;
      gv[r][c]=solution[r][c];
    }
    let guard=0;
    while(guard<60){
      guard++;
      const cnt = countSolutions(gv, chosenEdges, 2);
      if(cnt===1) break;
      if(guard%2===0 && edgeIdx<allEdges.length) chosenEdges.push(allEdges[edgeIdx++]);
      else if(cellIdx<cellsOrder.length){
        const idx = cellsOrder[cellIdx++];
        const r=Math.floor(idx/N), c=idx%N;
        gv[r][c]=solution[r][c];
      } else if(edgeIdx<allEdges.length) chosenEdges.push(allEdges[edgeIdx++]);
      else break;
    }

    // The loop above only guarantees uniqueness, not a minimal board — it easily
    // ends up with more = / × badges than necessary. Prune down to what's actually
    // required, dropping edges before given cells since fewer badges is the goal.
    function stillUnique(){ return countSolutions(gv, chosenEdges, 2)===1; }
    for(let pass=0; pass<2; pass++){
      let i=0;
      while(i<chosenEdges.length){
        const removed = chosenEdges.splice(i,1)[0];
        if(stillUnique()){ /* leave it removed */ }
        else { chosenEdges.splice(i,0,removed); i++; }
      }
      const filled = [];
      for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(gv[r][c]!==-1) filled.push({r,c});
      shuffle(filled).forEach(({r,c})=>{
        const v = gv[r][c];
        gv[r][c] = -1;
        if(!stillUnique()) gv[r][c] = v;
      });
    }

    return { givens: gv, edges: chosenEdges };
  }

  function newLevel(){
    const p = generatePuzzle();
    givens = p.givens;
    edges = p.edges;
    resetTimer();
    reset();
  }

  function reset(){
    if(errorTimeout){ clearTimeout(errorTimeout); errorTimeout=null; }
    cellState = givens.map(row=>row.slice());
    setRule('');
    hideWin();
    render();
  }

  function symbolFor(v){
    if(v===0) return '<span class="mark-sun">&#9728;</span>';
    if(v===1) return '<span class="mark-moon">&#9789;</span>';
    return '';
  }

  function render(){
    const stage = getStage();
    stage.innerHTML = '';
    const board = el('div','tango-board');
    board.style.setProperty('--n', N);
    cellEls = [];
    for(let r=0;r<N;r++){
      cellEls.push([]);
      for(let c=0;c<N;c++){
        const cell = el('div', 'tg-cell' + (givens[r][c]!==-1 ? ' fixed' : ''));
        cell.innerHTML = symbolFor(cellState[r][c]);
        if(givens[r][c]===-1){
          cell.addEventListener('click', ()=>{
            if(isWinShown()) return;
            cellState[r][c] = cellState[r][c]===-1 ? 0 : cellState[r][c]===0 ? 1 : -1;
            cell.innerHTML = symbolFor(cellState[r][c]);
            if(cellState[r][c]===0) Sound.sun();
            else if(cellState[r][c]===1) Sound.moon();
            validate();
          });
        }
        board.appendChild(cell);
        cellEls[r].push(cell);
      }
    }
    edgeEls = [];
    edges.forEach(e=>{
      const badge = el('div','tg-edge', e.type==='eq' ? '=' : '&times;');
      const horizontal = e.r1===e.r2;
      badge.classList.add(horizontal ? 'tg-edge-h' : 'tg-edge-v');
      const gridSpanPercent = 100/N;
      if(horizontal){
        badge.style.left = (gridSpanPercent*(e.c1+1))+'%';
        badge.style.top = (gridSpanPercent*(e.r1+0.5))+'%';
      } else {
        badge.style.left = (gridSpanPercent*(e.c1+0.5))+'%';
        badge.style.top = (gridSpanPercent*(e.r1+1))+'%';
      }
      board.appendChild(badge);
      edgeEls.push({e, el: badge});
    });
    stage.appendChild(board);
    validate();
  }

  function validate(){
    const errCells = new Set();
    for(let r=0;r<N;r++){
      let s=0,m=0;
      for(let c=0;c<N;c++){
        if(cellState[r][c]===0) s++; else if(cellState[r][c]===1) m++;
        if(c>=2 && cellState[r][c]!==-1 && cellState[r][c]===cellState[r][c-1] && cellState[r][c]===cellState[r][c-2]){
          errCells.add(r+','+c); errCells.add(r+','+(c-1)); errCells.add(r+','+(c-2));
        }
      }
      if(s>3 || m>3) for(let c=0;c<N;c++) if(cellState[r][c]!==-1) errCells.add(r+','+c);
    }
    for(let c=0;c<N;c++){
      let s=0,m=0;
      for(let r=0;r<N;r++){
        if(cellState[r][c]===0) s++; else if(cellState[r][c]===1) m++;
        if(r>=2 && cellState[r][c]!==-1 && cellState[r][c]===cellState[r-1][c] && cellState[r][c]===cellState[r-2][c]){
          errCells.add(r+','+c); errCells.add((r-1)+','+c); errCells.add((r-2)+','+c);
        }
      }
      if(s>3 || m>3) for(let r=0;r<N;r++) if(cellState[r][c]!==-1) errCells.add(r+','+c);
    }
    let edgesOk = true;
    edgeEls.forEach(({e})=>{
      const a = cellState[e.r1][e.c1], b = cellState[e.r2][e.c2];
      let bad = false;
      if(a!==-1 && b!==-1){
        if(e.type==='eq' && a!==b) bad = true;
        if(e.type==='neq' && a===b) bad = true;
      }
      if(bad){ edgesOk = false; errCells.add(e.r1+','+e.c1); errCells.add(e.r2+','+e.c2); }
    });

    // Clear any shown errors immediately so the board feels responsive while you're
    // mid-click (sun always comes before moon in the cycle). Only re-apply the red
    // highlight after a short pause, so a fleeting intermediate state doesn't flash.
    if(errorTimeout){ clearTimeout(errorTimeout); errorTimeout=null; }
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) cellEls[r][c].classList.remove('cell-error');
    edgeEls.forEach(({el:badgeEl})=> badgeEl.classList.remove('edge-error'));

    const fullyFilled = cellState.every(row=>row.every(v=>v!==-1));
    if(fullyFilled && errCells.size===0 && edgesOk){ showWin(); return; }

    if(errCells.size>0 || !edgesOk){
      errorTimeout = setTimeout(()=>{
        errCells.forEach(key=>{
          const [r,c] = key.split(',').map(Number);
          cellEls[r][c].classList.add('cell-error');
        });
        edgeEls.forEach(({e, el:badgeEl})=>{
          const a = cellState[e.r1][e.c1], b = cellState[e.r2][e.c2];
          let bad=false;
          if(a!==-1 && b!==-1){
            if(e.type==='eq' && a!==b) bad=true;
            if(e.type==='neq' && a===b) bad=true;
          }
          badgeEl.classList.toggle('edge-error', bad);
        });
      }, 500);
    }
  }

  return { newLevel, reset, RULE };
})();

/* ============ MINI SUDOKU (6x6, 2x3 boxes) ============ */
const MiniSudoku = (function(){
  const N=6, BR=2, BC=3;
  let givens, cellState, selected=null, cellEls;
  const RULE = 'Every number 1–6 exactly once per row, column, and 2×3 box. Select a cell, then tap a number.';

  function generateSolution(){
    const grid = Array.from({length:N},()=>Array(N).fill(0));
    function ok(r,c,v){
      for(let i=0;i<N;i++){ if(grid[r][i]===v) return false; if(grid[i][c]===v) return false; }
      const br=Math.floor(r/BR)*BR, bc=Math.floor(c/BC)*BC;
      for(let i=0;i<BR;i++) for(let j=0;j<BC;j++) if(grid[br+i][bc+j]===v) return false;
      return true;
    }
    function backtrack(idx){
      if(idx===N*N) return true;
      const r=Math.floor(idx/N), c=idx%N;
      for(const v of shuffle([1,2,3,4,5,6])){
        if(ok(r,c,v)){
          grid[r][c]=v;
          if(backtrack(idx+1)) return true;
          grid[r][c]=0;
        }
      }
      return false;
    }
    backtrack(0);
    return grid;
  }

  function countSolutions(gv, cap){
    const grid = gv.map(row=>row.slice());
    let count=0;
    function ok(r,c,v){
      for(let i=0;i<N;i++){ if(grid[r][i]===v) return false; if(grid[i][c]===v) return false; }
      const br=Math.floor(r/BR)*BR, bc=Math.floor(c/BC)*BC;
      for(let i=0;i<BR;i++) for(let j=0;j<BC;j++) if(grid[br+i][bc+j]===v) return false;
      return true;
    }
    function backtrack(idx){
      if(count>=cap) return;
      if(idx===N*N){ count++; return; }
      const r=Math.floor(idx/N), c=idx%N;
      if(grid[r][c]!==0){ backtrack(idx+1); return; }
      for(let v=1;v<=6;v++){
        if(ok(r,c,v)){
          grid[r][c]=v;
          backtrack(idx+1);
          grid[r][c]=0;
          if(count>=cap) return;
        }
      }
    }
    backtrack(0);
    return count;
  }

  function generatePuzzle(minClues){
    const solution = generateSolution();
    const gv = solution.map(row=>row.slice());
    const order = shuffle([...Array(N*N).keys()]);
    let clueCount = N*N;
    for(const idx of order){
      if(clueCount<=minClues) break;
      const r=Math.floor(idx/N), c=idx%N;
      const backup = gv[r][c];
      gv[r][c]=0;
      const cnt = countSolutions(gv,2);
      if(cnt===1) clueCount--;
      else gv[r][c]=backup;
    }
    return gv;
  }

  function newLevel(){
    givens = generatePuzzle(randInt(12,16));
    resetTimer();
    reset();
  }

  function reset(){
    cellState = givens.map(row=>row.slice());
    selected = null;
    setRule('');
    hideWin();
    render();
  }

  function render(){
    const stage = getStage();
    stage.innerHTML = '';
    const board = el('div','sudoku-board');
    board.style.setProperty('--n', N);
    cellEls = [];
    for(let r=0;r<N;r++){
      cellEls.push([]);
      for(let c=0;c<N;c++){
        const fixed = givens[r][c]!==0;
        const cell = el('div', 'su-cell' + (fixed?' fixed':'') + ((Math.floor(c/BC)+Math.floor(r/BR))%2===0?' shade':''));
        if(c%BC===0) cell.classList.add('box-left');
        if(r%BR===0) cell.classList.add('box-top');
        cell.textContent = cellState[r][c]!==0 ? cellState[r][c] : '';
        if(!fixed){
          cell.addEventListener('click', ()=>{
            if(isWinShown()) return;
            if(selected) selected.el.classList.remove('selected');
            selected = { el: cell, r, c };
            cell.classList.add('selected');
          });
        }
        board.appendChild(cell);
        cellEls[r].push(cell);
      }
    }
    stage.appendChild(board);

    const pad = el('div','num-pad');
    for(let v=1;v<=6;v++){
      const btn = el('button','num-btn', v);
      btn.addEventListener('click', ()=>{
        if(!selected || isWinShown()) return;
        cellState[selected.r][selected.c] = v;
        selected.el.textContent = v;
        Sound.number();
        validate();
      });
      pad.appendChild(btn);
    }
    const clearBtn = el('button','num-btn num-clear', 'Clear');
    clearBtn.addEventListener('click', ()=>{
      if(!selected || isWinShown()) return;
      cellState[selected.r][selected.c] = 0;
      selected.el.textContent = '';
      validate();
    });
    pad.appendChild(clearBtn);
    stage.appendChild(pad);

    document.onkeydown = keyHandler;
    validate();
  }

  function keyHandler(e){
    if(!selected || isWinShown()) return;
    if(e.key>='1' && e.key<='6'){
      cellState[selected.r][selected.c] = +e.key;
      selected.el.textContent = e.key;
      Sound.number();
      validate();
    } else if(e.key==='Backspace' || e.key==='Delete' || e.key==='0'){
      cellState[selected.r][selected.c] = 0;
      selected.el.textContent = '';
      validate();
    }
  }

  function validate(){
    const errCells = new Set();
    for(let r=0;r<N;r++){
      const seen = {};
      for(let c=0;c<N;c++){
        const v = cellState[r][c];
        if(v===0) continue;
        (seen[v]=seen[v]||[]).push(r+','+c);
      }
      Object.values(seen).forEach(list=>{ if(list.length>1) list.forEach(k=>errCells.add(k)); });
    }
    for(let c=0;c<N;c++){
      const seen = {};
      for(let r=0;r<N;r++){
        const v = cellState[r][c];
        if(v===0) continue;
        (seen[v]=seen[v]||[]).push(r+','+c);
      }
      Object.values(seen).forEach(list=>{ if(list.length>1) list.forEach(k=>errCells.add(k)); });
    }
    for(let br=0;br<N;br+=BR) for(let bc=0;bc<N;bc+=BC){
      const seen = {};
      for(let i=0;i<BR;i++) for(let j=0;j<BC;j++){
        const r=br+i, c=bc+j, v = cellState[r][c];
        if(v===0) continue;
        (seen[v]=seen[v]||[]).push(r+','+c);
      }
      Object.values(seen).forEach(list=>{ if(list.length>1) list.forEach(k=>errCells.add(k)); });
    }
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) cellEls[r][c].classList.remove('cell-error');
    errCells.forEach(key=>{
      const [r,c] = key.split(',').map(Number);
      cellEls[r][c].classList.add('cell-error');
    });
    const fullyFilled = cellState.every(row=>row.every(v=>v!==0));
    if(fullyFilled && errCells.size===0) showWin();
  }

  return { newLevel, reset, RULE };
})();

/* ============ ZIP ============ */
const Zip = (function(){
  let rows, cols, numberGrid, wallSet, path, dragging=false, cellEls;
  const RULE = 'Connect all cells with one path that visits 1, 2, 3 ... in order. You must start at the 1. Drag to draw, tap a cell on the path to step back.';

  function generateHamiltonianPath(r, c){
    const total = r*c;
    const idx = (rr,cc)=>rr*c+cc;
    let p = [];
    for(let rr=0;rr<r;rr++){
      if(rr%2===0){ for(let cc=0;cc<c;cc++) p.push(idx(rr,cc)); }
      else { for(let cc=c-1;cc>=0;cc--) p.push(idx(rr,cc)); }
    }
    const pos = Array(total);
    p.forEach((cell,i)=>pos[cell]=i);
    function neighborsOf(cell){
      const rr=Math.floor(cell/c), cc=cell%c;
      const res=[];
      if(rr>0) res.push(idx(rr-1,cc));
      if(rr<r-1) res.push(idx(rr+1,cc));
      if(cc>0) res.push(idx(rr,cc-1));
      if(cc<c-1) res.push(idx(rr,cc+1));
      return res;
    }
    const iterations = total*25;
    for(let it=0; it<iterations; it++){
      if(Math.random()<0.5){ p.reverse(); p.forEach((cell,i)=>pos[cell]=i); }
      const endCell = p[0];
      const candidates = neighborsOf(endCell).filter(nb => pos[nb] > 1);
      if(candidates.length===0) continue;
      const chosen = candidates[Math.floor(Math.random()*candidates.length)];
      const k = pos[chosen];
      const head = p.slice(0,k).reverse();
      const tail = p.slice(k);
      p = head.concat(tail);
      p.forEach((cell,i)=>pos[cell]=i);
    }
    return p.map(cell=>({r:Math.floor(cell/c), c:cell%c}));
  }

  function edgeKey(a,b){
    const k1=a.r+','+a.c, k2=b.r+','+b.c;
    return k1<k2 ? k1+'|'+k2 : k2+'|'+k1;
  }

  function buildWalls(r, c, solPath, fraction){
    const usedEdges = new Set();
    for(let i=0;i<solPath.length-1;i++) usedEdges.add(edgeKey(solPath[i], solPath[i+1]));
    const allEdges = [];
    for(let rr=0;rr<r;rr++) for(let cc=0;cc<c;cc++){
      if(cc+1<c) allEdges.push([{r:rr,c:cc},{r:rr,c:cc+1}]);
      if(rr+1<r) allEdges.push([{r:rr,c:cc},{r:rr+1,c:cc}]);
    }
    const nonPath = allEdges.filter(([a,b]) => !usedEdges.has(edgeKey(a,b)));
    const shuffled = shuffle(nonPath);
    const wallCount = Math.round(shuffled.length * fraction);
    const walls = new Set();
    for(let i=0;i<wallCount;i++) walls.add(edgeKey(shuffled[i][0], shuffled[i][1]));
    return walls;
  }

  function newLevel(){
    rows = randInt(5,7); cols = randInt(5,7);
    const solPath = generateHamiltonianPath(rows, cols);
    const total = rows*cols;
    const numCheckpoints = randInt(Math.max(4,Math.round(total/6)), Math.max(5,Math.round(total/4)));
    const step = (total-1) / (numCheckpoints-1);
    numberGrid = Array.from({length:rows},()=>Array(cols).fill(0));
    for(let k=0;k<numCheckpoints;k++){
      const i = Math.round(k*step);
      const {r,c} = solPath[i];
      numberGrid[r][c] = k+1;
    }
    wallSet = buildWalls(rows, cols, solPath, 0.4);
    resetTimer();
    reset();
  }

  function reset(){
    path = [];
    setRule('');
    hideWin();
    render();
  }

  function cellKey(r,c){ return r+','+c; }

  function render(){
    const stage = getStage();
    stage.innerHTML = '';
    const wrap = el('div','zip-wrap');
    const board = el('div','zip-board');
    board.style.setProperty('--rows', rows);
    board.style.setProperty('--cols', cols);
    cellEls = [];
    for(let r=0;r<rows;r++){
      cellEls.push([]);
      for(let c=0;c<cols;c++){
        const cell = el('div','zip-cell');
        cell.dataset.r=r; cell.dataset.c=c;
        if(numberGrid[r][c]) cell.innerHTML = `<span class="zip-num">${numberGrid[r][c]}</span>`;
        cell.addEventListener('pointerdown', (e)=>{ if(isWinShown()) return; e.preventDefault(); dragging=true; handleCellHit(r,c,true); });
        board.appendChild(cell);
        cellEls[r].push(cell);
      }
    }
    // wall overlays
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(c+1<cols && wallSet.has(edgeKey({r,c},{r,c:c+1}))){
        const w = el('div','zip-wall zip-wall-v');
        w.style.left = ((c+1)/cols*100)+'%';
        w.style.top = (r/rows*100)+'%';
        w.style.height = (1/rows*100)+'%';
        board.appendChild(w);
      }
      if(r+1<rows && wallSet.has(edgeKey({r,c},{r:r+1,c}))){
        const w = el('div','zip-wall zip-wall-h');
        w.style.top = ((r+1)/rows*100)+'%';
        w.style.left = (c/cols*100)+'%';
        w.style.width = (1/cols*100)+'%';
        board.appendChild(w);
      }
    }
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('class','zip-line-overlay');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    const poly = document.createElementNS(svgNS,'polyline');
    poly.setAttribute('class','zip-poly');
    svg.appendChild(poly);
    board.appendChild(svg);
    wrap.appendChild(board);
    const progress = el('p','zip-progress mono');
    wrap.appendChild(progress);
    stage.appendChild(wrap);

    document.onpointermove = (e)=>{
      if(!dragging) return;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      if(target && target.classList && target.classList.contains('zip-cell')){
        handleCellHit(+target.dataset.r, +target.dataset.c, false);
      }
    };
    document.onpointerup = ()=>{
      if(dragging){ dragging=false; validate(); }
    };
    updateVisuals();
  }

  function areAdjacentAndOpen(a,b){
    if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1) return false;
    return !wallSet.has(edgeKey(a,b));
  }

  function handleCellHit(r,c,isTap){
    if(isWinShown()) return;
    const idxInPath = path.findIndex(p=>p.r===r&&p.c===c);
    if(path.length===0){
      if(numberGrid[r][c] !== 1){
        if(isTap) flashInvalid('Start at the 1.');
        return;
      }
      path.push({r,c});
      Sound.checkpoint();
    } else if(idxInPath !== -1){
      if(idxInPath === path.length-2){
        // stepping back onto the immediately previous cell: normal one-step undo
        path.pop();
      } else if(isTap && idxInPath !== path.length-1){
        // deliberately tapping an earlier point on the path: reset back to there
        path = path.slice(0, idxInPath+1);
      }
      // otherwise: the drag just crossed an older part of the path — block the move
      // but keep the path exactly as it is, so you can continue from where you were
    } else {
      const last = path[path.length-1];
      if(areAdjacentAndOpen(last,{r,c})){
        path.push({r,c});
        if(numberGrid[r][c]) Sound.checkpoint();
      }
    }
    updateVisuals();
  }

  function updateVisuals(){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) cellEls[r][c].classList.remove('in-path','path-end');
    path.forEach(p=>cellEls[p.r][p.c].classList.add('in-path'));
    if(path.length){
      cellEls[path[0].r][path[0].c].classList.add('path-end');
      cellEls[path[path.length-1].r][path[path.length-1].c].classList.add('path-end');
    }
    const poly = document.querySelector('.zip-poly');
    if(poly){
      const pts = path.map(p => `${(p.c+0.5)/cols*100},${(p.r+0.5)/rows*100}`).join(' ');
      poly.setAttribute('points', pts);
    }
    const progress = document.querySelector('.zip-progress');
    if(progress) progress.textContent = `${path.length} / ${rows*cols} cells`;
  }

  function validate(){
    const total = rows*cols;
    if(path.length !== total) return;
    const seq = [];
    path.forEach((p,i)=>{ if(numberGrid[p.r][p.c]) seq.push({n:numberGrid[p.r][p.c], i}); });
    const forward = seq.every((s,i)=> s.n === i+1);
    const backward = seq.every((s,i)=> s.n === seq.length-i);
    if(forward || backward) showWin();
    else flashInvalid('All cells visited, but the numbers aren\'t in the right order.');
  }

  function flashInvalid(msg){
    setRule(msg);
    setTimeout(()=>{ if(!isWinShown()) setRule(''); }, 2200);
  }

  return { newLevel, reset, RULE };
})();

/* ============ PATCHES ============ */
const Patches = (function(){
  let rows, cols, clueGrid, ownerGrid, patches, nextId, dragging=false, anchor=null, currentRect=null, cellEls;
  let pendingRemoveId=null, movedDuringDrag=false;
  let runR0=0, runR1=0, runC0=0, runC1=0, patchErrorTimeout=null;
  const PALETTE = ['#F2B8C6','#9FE0C8','#FFD08A','#A9C4F5','#D8B4F0','#F5C08A','#9AD6D6','#E3B89A','#C3DE8E','#F0B4D0'];
  const RULE = 'Split the grid into rectangles. Each rectangle contains exactly one number — its area and orientation (portrait/landscape) must match that number. Drag to draw, tap a rectangle to remove it.';

  function generatePartition(r, c, maxArea){
    const rects = [];
    function split(r0,c0,r1,c1){
      const h = r1-r0+1, w = c1-c0+1;
      const area = h*w;
      const canV = w>1;
      const canH = h>1;
      // Splitting along a dimension smaller than 4 forces a 1-wide/1-tall sliver on
      // one side — real puzzles rarely have those, so we actively steer away from
      // this direction whenever the other direction doesn't have the same problem.
      const vNarrow = w<4;
      const hNarrow = h<4;
      const stuck = (!canV || vNarrow) && (!canH || hNarrow);
      const wantStop = (area<=maxArea && Math.random()<0.55) || (stuck && area<=maxArea*1.6) || (!canV && !canH);
      if(wantStop){ rects.push({r0,c0,r1,c1}); return; }
      const vOK = canV && !vNarrow;
      const hOK = canH && !hNarrow;
      let doV;
      if(vOK && hOK) doV = Math.random()<0.5;
      else if(vOK) doV = true;
      else if(hOK) doV = false;
      else doV = canV;
      if(doV){
        let w1;
        if(w>=5) w1 = randInt(2, w-2);
        else if(w===4) w1 = 2;
        else if(w===3) w1 = randInt(1,2);
        else w1 = 1;
        const cut = c0+w1;
        split(r0,c0,r1,cut-1); split(r0,cut,r1,c1);
      } else {
        let h1;
        if(h>=5) h1 = randInt(2, h-2);
        else if(h===4) h1 = 2;
        else if(h===3) h1 = randInt(1,2);
        else h1 = 1;
        const cut = r0+h1;
        split(r0,c0,cut-1,c1); split(cut,c0,r1,c1);
      }
    }
    split(0,0,r-1,c-1);
    return rects;
  }

  // ---- Shikaku solver: used only during generation, to reject any puzzle that has
  // more than one valid tiling. Without this, region growth easily produces layouts
  // where the "intended" rectangle is just one of several that would work, which is
  // what made it feel too easy / too obvious.
  function findCandidates(clue, cr, cc, rows, cols, clueGrid){
    const cands = [];
    const n = clue.n;
    for(let h=1; h<=n; h++){
      if(n % h !== 0) continue;
      const w = n / h;
      if(h>rows || w>cols) continue;
      if(clue.shape==='tall' && !(h>w)) continue;
      if(clue.shape==='wide' && !(w>h)) continue;
      if(clue.shape==='square' && w!==h) continue;
      for(let r0=Math.max(0,cr-h+1); r0<=Math.min(cr,rows-h); r0++){
        for(let c0=Math.max(0,cc-w+1); c0<=Math.min(cc,cols-w); c0++){
          const r1=r0+h-1, c1=c0+w-1;
          let ok = true;
          for(let rr=r0; rr<=r1 && ok; rr++) for(let cc2=c0; cc2<=c1; cc2++){
            if(clueGrid[rr][cc2] && !(rr===cr&&cc2===cc)){ ok=false; break; }
          }
          if(ok) cands.push({r0,c0,r1,c1});
        }
      }
    }
    return cands;
  }

  function countShikakuSolutions(rows, cols, clues, cap){
    const occ = Array.from({length:rows},()=>Array(cols).fill(-1));
    let count = 0;
    function fits(rect){
      for(let r=rect.r0;r<=rect.r1;r++) for(let c=rect.c0;c<=rect.c1;c++) if(occ[r][c]!==-1) return false;
      return true;
    }
    function place(rect, idx){ for(let r=rect.r0;r<=rect.r1;r++) for(let c=rect.c0;c<=rect.c1;c++) occ[r][c]=idx; }
    function unplace(rect){ for(let r=rect.r0;r<=rect.r1;r++) for(let c=rect.c0;c<=rect.c1;c++) occ[r][c]=-1; }
    function bt(unresolved){
      if(count>=cap) return;
      if(unresolved.length===0){ count++; return; }
      let bestIdx=-1, bestList=null, bestCount=Infinity;
      for(const idx of unresolved){
        const list = clues[idx].candidates.filter(fits);
        if(list.length < bestCount){ bestCount=list.length; bestList=list; bestIdx=idx; }
        if(bestCount===0) break;
      }
      if(bestCount===0) return;
      const rest = unresolved.filter(i=>i!==bestIdx);
      for(const rect of bestList){
        place(rect, bestIdx);
        bt(rest);
        unplace(rect);
        if(count>=cap) return;
      }
    }
    bt(clues.map((_,i)=>i));
    return count;
  }

  function isFullyForced(rows, cols, clues){
    const occ = Array.from({length:rows},()=>Array(cols).fill(-1));
    const resolved = new Array(clues.length).fill(false);
    let remaining = clues.length;
    function fits(rect){
      for(let r=rect.r0;r<=rect.r1;r++) for(let c=rect.c0;c<=rect.c1;c++) if(occ[r][c]!==-1) return false;
      return true;
    }
    function place(rect, idx){ for(let r=rect.r0;r<=rect.r1;r++) for(let c=rect.c0;c<=rect.c1;c++) occ[r][c]=idx; }
    let progressed = true;
    while(progressed && remaining>0){
      progressed = false;
      for(let i=0;i<clues.length;i++){
        if(resolved[i]) continue;
        const list = clues[i].candidates.filter(fits);
        if(list.length===1){
          place(list[0], i);
          resolved[i]=true;
          remaining--;
          progressed = true;
        } else if(list.length===0){
          return false;
        }
      }
    }
    return remaining===0;
  }

  function newLevel(){
    let tries=0, hard=false, chosenClueGrid;
    do{
      tries++;
      rows = randInt(6,7); cols = randInt(6,7);
      const maxArea = randInt(7,10);
      const rects = generatePartition(rows, cols, maxArea);
      const cg = Array.from({length:rows},()=>Array(cols).fill(null));
      rects.forEach((rc,i)=>{
        const h = rc.r1-rc.r0+1, w = rc.c1-rc.c0+1;
        const cr = randInt(rc.r0, rc.r1), cc = randInt(rc.c0, rc.c1);
        const shape = w===h ? 'square' : (w>h ? 'wide' : 'tall');
        cg[cr][cc] = { n: h*w, shape, w, h, color: PALETTE[i % PALETTE.length] };
      });
      const clues = [];
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        if(cg[r][c]) clues.push({ cr:r, cc:c, candidates: findCandidates(cg[r][c], r, c, rows, cols, cg) });
      }
      const unique = countShikakuSolutions(rows, cols, clues, 2) === 1;
      // Being unique isn't enough on its own — most random layouts are unique but
      // every number still only ever has one possible spot the moment you look at
      // it, so you never actually have to weigh numbers against each other. Only
      // accept a layout where that simple one-candidate-at-a-time approach gets
      // stuck at some point, meaning real cross-referencing is required.
      hard = unique && !isFullyForced(rows, cols, clues);
      chosenClueGrid = cg;
    } while(!hard && tries<80);
    clueGrid = chosenClueGrid;
    resetTimer();
    reset();
  }

  function reset(){
    ownerGrid = Array.from({length:rows},()=>Array(cols).fill(-1));
    patches = [];
    nextId = 0;
    dragging = false; anchor = null; currentRect = null;
    pendingRemoveId = null; movedDuringDrag = false;
    runR0=0; runR1=0; runC0=0; runC1=0;
    if(patchErrorTimeout){ clearTimeout(patchErrorTimeout); patchErrorTimeout=null; }
    setRule('');
    hideWin();
    render();
  }

  function render(){
    const stage = getStage();
    stage.innerHTML = '';
    const board = el('div','patches-board');
    board.style.setProperty('--rows', rows);
    board.style.setProperty('--cols', cols);
    cellEls = [];
    for(let r=0;r<rows;r++){
      cellEls.push([]);
      for(let c=0;c<cols;c++){
        const cell = el('div','patch-cell');
        cell.dataset.r=r; cell.dataset.c=c;
        const clue = clueGrid[r][c];
        if(clue){
          const maxDim = Math.max(clue.w, clue.h);
          const previewW = Math.round(clue.w/maxDim*100);
          const previewH = Math.round(clue.h/maxDim*100);
          cell.innerHTML = `<span class="patch-preview" style="width:${previewW}%;height:${previewH}%;background:${clue.color};"></span><span class="patch-clue">${clue.n}</span>`;
        }
        cell.addEventListener('pointerdown', (e)=>{ if(isWinShown()) return; e.preventDefault(); onDown(r,c); });
        board.appendChild(cell);
        cellEls[r].push(cell);
      }
    }
    stage.appendChild(board);

    document.onpointermove = (e)=>{
      if(!dragging) return;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      if(target && target.classList){
        const cellDiv = target.closest ? target.closest('.patch-cell') : null;
        if(cellDiv) onMove(+cellDiv.dataset.r, +cellDiv.dataset.c);
      }
    };
    document.onpointerup = ()=>{ if(dragging) onUp(); dragging=false; };
    repaint();
  }

  function onDown(r,c){
    // Starting a drag on a cell that already belongs to a placed patch: remove that
    // patch, but keep going — the same gesture immediately begins drawing a new
    // rectangle. Seed the running box with the OLD patch's own footprint (not just
    // this one cell) so you can extend a patch that's missing a couple of cells
    // without having to redraw the whole thing from scratch.
    pendingRemoveId = ownerGrid[r][c] !== -1 ? ownerGrid[r][c] : null;
    movedDuringDrag = false;
    dragging = true;
    anchor = {r,c};
    if(pendingRemoveId !== null){
      const old = patches.find(p=>p.id===pendingRemoveId);
      runR0 = Math.min(old.r0, r); runR1 = Math.max(old.r1, r);
      runC0 = Math.min(old.c0, c); runC1 = Math.max(old.c1, c);
    } else {
      runR0 = r; runR1 = r; runC0 = c; runC1 = c;
    }
    currentRect = {r0:runR0,c0:runC0,r1:runR1,c1:runC1};
    repaint();
  }

  function onMove(r,c){
    if(!dragging) return;
    if(r!==anchor.r || c!==anchor.c) movedDuringDrag = true;
    if(pendingRemoveId !== null && movedDuringDrag){
      removePatch(pendingRemoveId);
      pendingRemoveId = null;
    }
    // Grow the running box to include this point — it only ever expands during a
    // single drag, so going down from the start cell and then back up past it keeps
    // the part you already covered instead of snapping to only one side.
    const r0 = Math.min(runR0, r), r1 = Math.max(runR1, r);
    const c0 = Math.min(runC0, c), c1 = Math.max(runC1, c);
    let clear = true;
    for(let rr=r0; rr<=r1 && clear; rr++) for(let cc=c0; cc<=c1; cc++){
      if(ownerGrid[rr][cc] !== -1){ clear=false; break; }
    }
    if(clear){
      runR0=r0; runR1=r1; runC0=c0; runC1=c1;
      currentRect = {r0,c0,r1,c1};
    }
    repaint();
  }

  function onUp(){
    if(pendingRemoveId !== null && !movedDuringDrag){
      // Plain tap on an existing patch with no drag afterwards: just remove it,
      // don't redraw a 1-cell patch in its place.
      removePatch(pendingRemoveId);
      pendingRemoveId = null;
      currentRect = null; anchor = null;
      repaint();
      scheduleErrorCheck();
      return;
    }
    if(currentRect){
      const isSingleCell = currentRect.r0===currentRect.r1 && currentRect.c0===currentRect.c1;
      const clueHere = clueGrid[currentRect.r0][currentRect.c0];
      const isIntentional1 = clueHere && clueHere.n === 1;
      if(isSingleCell && !movedDuringDrag && !isIntentional1){
        // a plain, no-drag tap on an empty cell — treat as accidental, don't
        // place a grey 1-cell patch that just blocks the board
        currentRect = null;
      }
    }
    if(currentRect){
      // A rectangle with no clue in it at all can never be a valid patch — don't
      // commit it (this used to show up as an aimless grey block that just blocks).
      let hasClue = false;
      for(let r=currentRect.r0;r<=currentRect.r1 && !hasClue;r++) for(let c=currentRect.c0;c<=currentRect.c1;c++){
        if(clueGrid[r][c]){ hasClue = true; break; }
      }
      if(!hasClue) currentRect = null;
    }
    if(currentRect){
      const id = nextId++;
      for(let r=currentRect.r0;r<=currentRect.r1;r++) for(let c=currentRect.c0;c<=currentRect.c1;c++) ownerGrid[r][c]=id;
      let color = null;
      for(let r=currentRect.r0;r<=currentRect.r1 && !color;r++) for(let c=currentRect.c0;c<=currentRect.c1;c++){
        if(clueGrid[r][c]){ color = clueGrid[r][c].color; break; }
      }
      patches.push({ id, ...currentRect, color: color || '#8892A0' });
      Sound.snap();
    }
    currentRect = null; anchor = null; pendingRemoveId = null;
    repaint();
    scheduleErrorCheck();
    validate();
  }

  function removePatch(id){
    patches = patches.filter(p=>p.id!==id);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(ownerGrid[r][c]===id) ownerGrid[r][c]=-1;
    hideWin();
  }

  function repaint(){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const cell = cellEls[r][c];
      cell.classList.remove('preview','has-patch');
      cell.style.background = '';
      cell.classList.remove('edge-t','edge-b','edge-l','edge-r');
    }
    patches.forEach(p=>{
      for(let r=p.r0;r<=p.r1;r++) for(let c=p.c0;c<=p.c1;c++){
        cellEls[r][c].style.background = p.color;
        cellEls[r][c].classList.add('has-patch');
      }
      for(let r=p.r0;r<=p.r1;r++){ cellEls[r][p.c0].classList.add('edge-l'); cellEls[r][p.c1].classList.add('edge-r'); }
      for(let c=p.c0;c<=p.c1;c++){ cellEls[p.r0][c].classList.add('edge-t'); cellEls[p.r1][c].classList.add('edge-b'); }
    });
    if(currentRect){
      for(let r=currentRect.r0;r<=currentRect.r1;r++) for(let c=currentRect.c0;c<=currentRect.c1;c++) cellEls[r][c].classList.add('preview');
    }
  }

  function isPatchValid(p){
    const h = p.r1-p.r0+1, w = p.c1-p.c0+1;
    let clueCells = [];
    for(let r=p.r0;r<=p.r1;r++) for(let c=p.c0;c<=p.c1;c++) if(clueGrid[r][c]) clueCells.push(clueGrid[r][c]);
    if(clueCells.length !== 1) return false;
    const clue = clueCells[0];
    if(clue.n !== h*w) return false;
    // Same orientation category as the clue's own shape: a "tall" clue (portrait)
    // may be satisfied by any factor pair as long as it stays taller-than-wide
    // (e.g. 6x1 or 3x2 for a 6-clue), but never a "wide" rectangle like 2x3.
    if(clue.shape==='tall' && !(h>w)) return false;
    if(clue.shape==='wide' && !(w>h)) return false;
    if(clue.shape==='square' && w!==h) return false;
    return true;
  }

  function scheduleErrorCheck(){
    if(patchErrorTimeout){ clearTimeout(patchErrorTimeout); patchErrorTimeout=null; }
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) cellEls[r][c].classList.remove('cell-error');
    patchErrorTimeout = setTimeout(()=>{
      patches.forEach(p=>{
        if(!isPatchValid(p)){
          for(let r=p.r0;r<=p.r1;r++) for(let c=p.c0;c<=p.c1;c++) cellEls[r][c].classList.add('cell-error');
        }
      });
    }, 550);
  }

  function validate(){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(ownerGrid[r][c]===-1) return;
    const allOk = patches.every(isPatchValid);
    if(allOk) showWin();
    else flashInvalid('All cells covered, but at least one rectangle doesn\'t match its number or orientation.');
  }

  function flashInvalid(msg){
    setRule(msg);
    setTimeout(()=>{ if(!isWinShown()) setRule(''); }, 2200);
  }

  return { newLevel, reset, RULE };
})();

/* ============ MODULE REGISTRY + BOOT ============ */
const MODULES = { queens: Queens, tango: Tango, zip: Zip, sudoku: MiniSudoku, patches: Patches };
window.addEventListener('pointerdown', function firstTapUnlock(){
  Sound.unlock();
  window.removeEventListener('pointerdown', firstTapUnlock, true);
}, true);
renderMenu();
</script>
